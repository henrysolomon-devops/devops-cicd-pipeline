# This is the first of what's now four CloudFormation stacks (up from
# three in v9). The network layer itself barely changes for v10 - same
# VPC, same two public subnets, same internet gateway, same route table.
# What's new is a set of tags on both subnets that EKS and the AWS Load
# Balancer Controller both silently depend on to discover which subnets
# belong to which cluster.
#
# Worth calling out up front: PublicSubnetTwo existed in v9 purely to
# satisfy the ALB's own multi-AZ requirement - it never held an EC2
# instance. In v10 it picks up a second, independent reason to exist:
# EKS itself refuses to create a cluster with fewer than two subnets in
# two different Availability Zones, entirely separate from anything the
# Load Balancer Controller needs. Two unrelated AWS services landing on
# the exact same "two AZs, minimum" requirement is a coincidence worth
# noting, not a sign this subnet is doing double duty by accident.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  devops-cicd-pipeline - networking layer (VPC, two public subnets,
  internet gateway, route table). Deployed and torn down as its own
  stack so the EKS cluster stack above it can be rebuilt independently
  without ever touching the network underneath it.

Parameters:
  EksClusterName:
    Type: String
    Default: devops-pipeline-eks
    Description: >
      Name of the EKS cluster that will eventually sit on top of these
      subnets. Needed here, in the network stack, purely so the
      "kubernetes.io/cluster/<name>: shared" tag below can be set
      correctly - EKS and the AWS Load Balancer Controller both use this
      tag to discover which subnets they're allowed to use, and neither
      one will find these subnets without it, no matter how correctly
      everything else is configured. This has to match the cluster name
      used in eks-cluster-stack.yaml exactly, or discovery silently
      fails with no clear error pointing at the tag.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: devops-pipeline-vpc

  # The only subnet the EC2 worker node itself ever lives in, same as
  # every version since v9. The two new tags below are what actually
  # changes for v10:
  #
  # - kubernetes.io/cluster/<name>: shared tells both EKS itself and the
  #   AWS Load Balancer Controller "this subnet belongs to this cluster,
  #   you're allowed to use it." Without it, the node group can still
  #   technically launch here, but the Load Balancer Controller will
  #   refuse to place an ALB in a subnet it doesn't recognize as its own.
  # - kubernetes.io/role/elb: 1 tells the Load Balancer Controller
  #   specifically "this is a public subnet, put internet-facing load
  #   balancers here." There's a matching kubernetes.io/role/internal-elb
  #   tag for private subnets, not used here since this project has no
  #   private subnets at all.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: devops-pipeline-public-subnet
        - Key: !Sub "kubernetes.io/cluster/${EksClusterName}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  # Same two new tags as above - EKS needs both subnets tagged
  # identically, not just the one the node actually runs in, since the
  # cluster itself (not just the Load Balancer Controller) checks these
  # tags when deciding which subnets it's allowed to schedule networking
  # resources into.
  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: devops-pipeline-public-subnet-two
        - Key: !Sub "kubernetes.io/cluster/${EksClusterName}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: devops-pipeline-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: devops-pipeline-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetTwo
      RouteTableId: !Ref PublicRouteTable

# Everything below gets picked up by the EKS cluster stack next, through
# Fn::ImportValue - the same export names as v9, unchanged, so nothing
# downstream has to be aware this stack changed at all beyond the tags.
Outputs:
  VpcId:
    Description: ID of the VPC, needed by the EKS cluster stack
    Value: !Ref VPC
    Export:
      Name: devops-pipeline-vpc-id

  PublicSubnetId:
    Description: ID of the first public subnet, needed by the EKS cluster stack
    Value: !Ref PublicSubnet
    Export:
      Name: devops-pipeline-public-subnet-id

  PublicSubnetTwoId:
    Description: ID of the second public subnet, needed by the EKS cluster stack to satisfy its own multi-AZ requirement
    Value: !Ref PublicSubnetTwo
    Export:
      Name: devops-pipeline-public-subnet-two-id
