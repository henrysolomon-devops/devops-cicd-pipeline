# Helm values for prometheus-community/kube-prometheus-stack, installed
# by infra.yml into the "monitoring" namespace. This is the single
# source of truth for how Prometheus and Grafana are configured - none
# of this is ever clicked together by hand, so it survives every
# terraform destroy/apply cycle exactly the same way every time.

prometheus:
  prometheusSpec:
    # By default this chart only lets Prometheus discover ServiceMonitors
    # that carry its own Helm release label, and only within its own
    # namespace. Our app's ServiceMonitor (from the devops-pipeline
    # chart) lives in dev/staging/production and was never given that
    # label, so both of these have to be relaxed, or Prometheus simply
    # never finds it.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}

    # Added in v8.1, same reasoning as the two lines above: by default Prometheus
    # only picks up PrometheusRule objects carrying its own Helm release label,
    # and only from its own namespace. The app-level rules live in
    # dev/staging/production (via the devops-pipeline chart) and the infra-level
    # rules live right here in monitoring but without that label - both would be
    # silently ignored without this.
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    # How long Prometheus keeps scraped data before dropping it. Since
    # the server itself is never left running between tests (see the
    # project's cost/safety rules), this number barely matters in
    # practice - everything gets wiped on the next destroy anyway - so
    # the chart's own sensible default is kept rather than tuned.
    retention: 10d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Enabled in v8.1, now that there's actually something useful to alert on and
# somewhere for those alerts to go. The routing itself (which alert goes to which
# Slack channel) is deliberately kept out of this file and lives in
# monitoring/alertmanager-config.yaml instead, merged in as a second -f flag when
# infra.yml runs Helm - that keeps the always-static chart config here separate
# from the file that has secrets substituted into it at apply time.
# Added in v8.1: kube-prometheus-stack ships default ServiceMonitors and
# alerting rules for kube-scheduler, kube-controller-manager, etcd, and
# kube-proxy - all written for a standard kubeadm cluster. k3s doesn't expose
# any of these the same way (etcd in particular isn't reachable on the port
# the chart expects), so these targets sit permanently "down". That was
# harmless back in v8 with Alertmanager disabled, but now that it's enabled,
# every one of those false targets would fire a TargetDown alert with no
# `team` label, fall through to the default route, and flood #alerts-app with
# noise that has nothing to do with this project's own app or infra alerts.
# Disabling them here is the standard fix for kube-prometheus-stack on k3s.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  enabled: true

grafana:
  service:
    type: LoadBalancer
    # A new port, separate from every app port (5000-5002) and the k3s
    # API (6443). Needs its own permanent rule in terraform/security.tf,
    # scoped to MY_IP only, the same way SSH and the k3s API already are.
    port: 3000

  sidecar:
    dashboards:
      enabled: true
      # Same reasoning as the ServiceMonitor setting above: our app's
      # dashboard ConfigMap lives in the "dev" namespace (see
      # values-dev.yaml in the app chart), not in "monitoring" where
      # Grafana itself runs, so the sidecar has to be told to look
      # everywhere rather than just its own namespace.
      searchNamespace: ALL
      # This is the label the sidecar watches for - matches the
      # grafana_dashboard: "1" label set in the app chart's
      # grafana-dashboard-configmap.yaml template.
      label: grafana_dashboard

  # Registers Loki as a queryable datasource in Grafana, added in v8.1. This is
  # what makes the "Explore" tab (and any log panel added to a dashboard later)
  # actually able to pull log lines back. The URL assumes Loki gets installed
  # with the Helm release name "loki" into the "monitoring" namespace in
  # infra.yml, since gateway.enabled is false in loki-values.yaml, this points
  # straight at Loki's own Service rather than a gateway in front of it.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

  # No login screen. This mirrors the exact reasoning used for Jenkins
  # in v7 (securityRealm: None there): access to this port is already
  # restricted at the network level, to MY_IP only, via security.tf, so
  # a login prompt on top of that would just be friction with no real
  # security benefit.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
