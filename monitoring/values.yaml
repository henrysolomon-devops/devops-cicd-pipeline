# Helm values for prometheus-community/kube-prometheus-stack, installed
# by infra.yml into the "monitoring" namespace. This is the single
# source of truth for how Prometheus and Grafana are configured - none
# of this is ever clicked together by hand, so it survives every
# infra destroy/apply cycle exactly the same way every time.

prometheus:
  prometheusSpec:
    # By default this chart only lets Prometheus discover ServiceMonitors
    # that carry its own Helm release label, and only within its own
    # namespace. Our app's ServiceMonitor (from the devops-pipeline
    # chart) lives in dev/staging/production and was never given that
    # label, so both of these have to be relaxed, or Prometheus simply
    # never finds it.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}

    # Added in v8.1, same reasoning as the two lines above: by default Prometheus
    # only picks up PrometheusRule objects carrying its own Helm release label,
    # and only from its own namespace. The app-level rules live in
    # dev/staging/production (via the devops-pipeline chart) and the infra-level
    # rules live right here in monitoring but without that label - both would be
    # silently ignored without this.
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    # How long Prometheus keeps scraped data before dropping it. Since
    # the server itself is never left running between tests (see the
    # project's cost/safety rules), this number barely matters in
    # practice - everything gets wiped on the next destroy anyway - so
    # the chart's own sensible default is kept rather than tuned.
    retention: 10d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Enabled in v8.1, now that there's actually something useful to alert on and
# somewhere for those alerts to go. The routing itself (which alert goes to which
# Slack channel) is deliberately kept out of this file and lives in
# monitoring/alertmanager-config.yaml instead, merged in as a second -f flag when
# infra.yml runs Helm - that keeps the always-static chart config here separate
# from the file that has secrets substituted into it at apply time.
# Added in v8.1: kube-prometheus-stack ships default ServiceMonitors and
# alerting rules for kube-scheduler, kube-controller-manager, etcd, and
# kube-proxy - all written for a standard kubeadm cluster. Neither k3s (through
# v9) nor EKS's own managed control plane (from v10 onward) exposes any of
# these the same way - EKS in particular runs its control plane entirely
# outside this account, so there's no Node these could ever be scraped from
# even in principle. That was harmless back in v8 with Alertmanager disabled,
# but now that it's enabled, every one of those false targets would fire a
# TargetDown alert with no `team` label, fall through to the default route,
# and flood #alerts-app with noise that has nothing to do with this project's
# own app or infra alerts. Disabling them here is the standard fix for
# kube-prometheus-stack on any cluster that doesn't expose its own
# control-plane components as scrapeable Kubernetes Services.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  enabled: true

grafana:
  # Changed in v10. eks.amazonaws.com/role-arn is the same IRSA
  # mechanism now used for Loki (see monitoring/loki-values.yaml) -
  # this is what lets Grafana's own Pod read CloudWatch Logs and
  # metrics without any access key ever touching this file. Read-only,
  # scoped to exactly this one purpose - see
  # cloudformation/iam-irsa-stack.yaml's GrafanaCloudWatchIrsaRole for
  # the exact permissions granted. __AWS_ACCOUNT_ID__ is substituted by
  # infra.yml at apply time, the same pattern used for Loki's role ARN
  # and the Slack webhook URLs.
  serviceAccount:
    create: true
    name: monitoring-grafana
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::__AWS_ACCOUNT_ID__:role/devops-cicd-pipeline-grafana-cloudwatch-irsa-role"

  service:
    # Changed in v10. Through v9, k3s's own --service-node-port-range
    # flag was widened by hand (ansible/install-k3s.yml) so a low,
    # memorable port like 5010 was valid at all. EKS's control plane is
    # fully managed by AWS - there's no way to pass a custom
    # --service-node-port-range flag to it, so this has to move into
    # Kubernetes' own standard NodePort range (30000-32767) instead.
    # 30010 was picked purely to still echo the old 5010 for anyone
    # who remembers it. The security group enforcing "my own IP only"
    # (cloudformation/eks-cluster-stack.yaml's
    # GrafanaNodePortSecurityGroup) moves to match this exact port.
    type: NodePort
    port: 3000
    nodePort: 30010

  sidecar:
    dashboards:
      enabled: true
      # Same reasoning as the ServiceMonitor setting above: our app's
      # dashboard ConfigMap lives in the "dev" namespace (see
      # values-dev.yaml in the app chart), not in "monitoring" where
      # Grafana itself runs, so the sidecar has to be told to look
      # everywhere rather than just its own namespace.
      searchNamespace: ALL
      # This is the label the sidecar watches for - matches the
      # grafana_dashboard: "1" label set in the app chart's
      # grafana-dashboard-configmap.yaml template.
      label: grafana_dashboard

  # Two datasources now, not one. Loki is unchanged from v8.1. CloudWatch
  # is new in v10, and exists for exactly one reason: EKS's own control
  # plane (api-server, audit logs, scheduler, controller-manager) runs
  # entirely outside this account's visibility, so the only place its
  # logs ever land is CloudWatch Logs, via the ClusterLogging config in
  # cloudformation/eks-cluster-stack.yaml. Everything else this project
  # already monitors - the app, Redis, node-level metrics - stays on
  # Prometheus and Loki exactly as before; CloudWatch is deliberately
  # scoped to just the one thing that has nowhere else to live.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      # A fixed uid, rather than letting Grafana generate a random one on every
      # fresh install - the log panel on the app dashboard (added in v8.1)
      # references this exact uid directly, and a random one would silently
      # break that reference on every infra destroy/apply cycle.
      uid: loki

    - name: CloudWatch
      type: cloudwatch
      access: proxy
      isDefault: false
      uid: cloudwatch
      jsonData:
        # "default" tells the CloudWatch plugin to use whatever AWS
        # credentials are already available to the Pod - which, thanks
        # to the serviceAccount annotation above, means the IRSA role's
        # temporary credentials, not a stored access key.
        authType: default
        defaultRegion: us-east-1

  # No login screen. This mirrors the exact reasoning used for Jenkins
  # in v7 (securityRealm: None there): access to this port is already
  # restricted at the network level, to MyIp only, so a login prompt on
  # top of that would just be friction with no real security benefit.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
