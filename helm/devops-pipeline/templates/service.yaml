# Service for the Flask app, generated from Helm templates.
# This is the Helm equivalent of v2's k8s/service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-pipeline.fullname" . }}
  labels:
    {{- include "devops-pipeline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      # "http" here refers to the named port defined in deployment.yaml
      # (containerPort: {{ .Values.service.targetPort }}, i.e. 5000),
      # not a literal port number. Kubernetes resolves the name automatically.
      targetPort: http
      protocol: TCP
      name: http
      # Added in v9. Only meaningful when service.type is NodePort - this
      # pins the externally-reachable port to a known, fixed value
      # (5000/5001/5002) instead of letting Kubernetes assign one at
      # random from its NodePort range. The ALB's Target Groups in
      # cloudformation/loadbalancer-stack.yaml are each configured
      # against one of these exact ports ahead of time, so this has to
      # stay predictable rather than change on every reinstall.
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "devops-pipeline.selectorLabels" . | nindent 4 }}
