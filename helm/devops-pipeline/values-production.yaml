# Overrides for the "production" environment.
# Only fields that differ from values.yaml need to be listed here;
# everything else is inherited from the base values.yaml.

# Higher replica count in production: the live environment needs
# more headroom to tolerate a Pod crashing without losing capacity.
replicaCount: 3

# Reported by the app so the dashboard clearly shows "production" when
# you're looking at this namespace.
appEnv: "production"

# Added in v9: this is the path prefix the ALB forwards to this
# environment - anything under /production/* on the ALB's single public
# address lands here. See app/app.py for how the app itself uses this.
appUrlPrefix: "/production"

# production gets its own port too, same reasoning as staging. nodePort
# has to match this exactly, since that's the fixed port the ALB's
# production Target Group in cloudformation/loadbalancer-stack.yaml
# was pointed at.
service:
  port: 5002
  nodePort: 5002

# Same story as staging - this only changes through promote.yml, once
# a tag has already been confirmed working in staging and the
# resulting pull request has been reviewed and merged by hand.
image:
  tag: "ddbfa4887b6fbf9a9e89fff2bb242d3f4ef05362"
