# Overrides for the "staging" environment.
# Only fields that differ from values.yaml need to be listed here;
# everything else is inherited from the base values.yaml.

# Same replica count as the base default: staging should mirror
# production closely enough to catch issues before release.
replicaCount: 2

# Reported by the app so the dashboard clearly shows "staging" when
# you're looking at this namespace.
appEnv: "staging"

# staging gets its own port since it now lives on the same server and
# the same public IP as dev and production.
service:
  port: 5001

# This only ever gets updated by promote.yml, when a tag already
# confirmed working in dev is promoted here through a reviewed pull
# request - never edited by hand, and never touched directly by
# deploy.yml the way values-dev.yaml is.
image:
  tag: "53bd7877b58770943427e28e263805fcff1f3b41"
