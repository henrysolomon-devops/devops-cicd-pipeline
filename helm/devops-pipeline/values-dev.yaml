# Overrides for the "dev" environment.
# Only fields that differ from values.yaml need to be listed here;
# everything else is inherited from the base values.yaml.

# Lower replica count in dev: fast iteration and lower resource usage
# matter more than high availability while actively developing.
replicaCount: 1

# Reported by the app so the dashboard clearly shows "dev" when you're
# looking at this namespace.
appEnv: "dev"

# Before v6, this tag was never stored in a file at all - deploy.yml
# passed it straight to Helm with --set image.tag=<sha> at deploy time.
# Now that ArgoCD is the one applying changes (by reading this file,
# not by running a command), the tag has to actually live here so
# there's something for deploy.yml to update and something for ArgoCD
# to read. deploy.yml's dev job overwrites this value automatically on
# every build - there's no need to ever edit it by hand.
image:
  tag: "53bd7877b58770943427e28e263805fcff1f3b41"

# No service.port override needed here - the base values.yaml default
# (5000) already is dev's port. staging and production each override
# it below since they need their own distinct port on the same server.

# Added in v8: this Release is the one that carries the shared Grafana
# dashboard ConfigMap, since it only needs to be registered with
# Grafana once, not once per namespace. dev was picked because it's
# the one environment that's always kept in sync automatically.
grafanaDashboard:
  enabled: true
