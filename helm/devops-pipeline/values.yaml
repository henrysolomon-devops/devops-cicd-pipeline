# Default configuration values for the devops-pipeline Helm chart.
# These values fill in the placeholders inside templates/deployment.yaml
# and templates/service.yaml. Per-environment files (values-dev.yaml,
# values-staging.yaml, values-production.yaml) will override specific
# values below for each namespace.

# Number of Pod replicas. Matches the replica count used in v2's
# k8s/deployment.yaml (kubectl-based, same value across all namespaces there).
replicaCount: 2

# Container image settings.
image:
  # Since v5.1, all three environments run on the real EC2/k3s server
  # instead of a local kind cluster, so the image has to come from a
  # real registry rather than the local Docker daemon. This is the
  # same ghcr.io image GitHub Actions has been building and pushing
  # since v4.
  repository: ghcr.io/henrysolomon-devops/devops-cicd-pipeline
  pullPolicy: IfNotPresent
  # This tag is just a fallback for manual testing - in practice,
  # deploy.yml always overrides it with --set image.tag=<commit sha>
  # so every deploy uses the exact image that was just built.
  tag: "v1.0.0"

# The environment name shown on the dashboard and reported back by
# /api/status - dev, staging, or production. The base value here is just
# a fallback; each per-environment values file below overrides it so the
# running Pod actually knows which namespace it's living in.
appEnv: "unknown"

# Added in v9. The path prefix this environment is reached under once
# requests come through the ALB instead of hitting a dedicated port
# directly - /dev, /staging, or /production, set per environment below.
# Left blank here on purpose: with no override, the app just runs
# unprefixed at the root, which matters for local testing outside the
# cluster entirely (see app/app.py for the full reasoning).
appUrlPrefix: ""

# The ghcr.io package for this project is public, so no pull secret is
# needed for the cluster to fetch images from it.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# No custom ServiceAccount is needed for this project yet.
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Changed in v9. From v5.1 through v8.1, this was LoadBalancer, with
# k3s's built-in Klipper load balancer exposing each environment
# directly on the server's public IP. Now that a real AWS ALB sits in
# front of everything (see cloudformation/loadbalancer-stack.yaml),
# Klipper's job is gone - the ALB's Target Groups reach the app through
# a NodePort instead, registered directly against the EC2 instance and
# a fixed port per environment. That port has to be pinned explicitly
# with nodePort below rather than left to Kubernetes to assign
# randomly, since the Target Group in CloudFormation is configured
# against a specific, known port ahead of time. k3s's own NodePort
# range is widened to allow 5000-5002 specifically in
# ansible/install-k3s.yml, since Kubernetes only allows NodePort
# values from 30000-32767 by default.
service:
  type: NodePort
  port: 5000
  targetPort: 5000
  nodePort: 5000

# Added in v8, alongside the rest of the monitoring stack: without
# explicit limits, a single greedy Pod (Prometheus is the usual
# suspect) can starve everything else running on the same node, which
# is exactly the class of problem that forced a bigger instance size in
# v6. These numbers are intentionally modest - this app barely does
# any real work - and can be tuned later if a real bottleneck shows up.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Liveness/readiness probes, matching k8s/deployment.yaml from v2:
# both check GET /health on the container's port 5000. Still unprefixed
# even after v9's APP_URL_PREFIX was introduced - Kubernetes talks to
# the Pod directly here, never through the ALB's path routing, so
# there's nothing for a prefix to do in this specific check. See
# app/app.py for the full reasoning on why /health stays unprefixed.
livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Added in v8: a small, single-replica Redis used purely as a short-lived
# cache in front of the Open-Meteo weather lookup. No PersistentVolume,
# on purpose - see templates/redis-deployment.yaml for the full reasoning.
redis:
  image:
    repository: redis
    tag: "7.4-alpine"
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

# Added in v8: registers this app's /metrics endpoint with Prometheus.
# Disabling this per-environment is possible if ever needed, but there's
# no reason to in practice - every namespace should be scraped the same way.
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

# Added in v8: controls whether this Release also installs the shared
# Grafana dashboard ConfigMap. Left off by default here and switched on
# only in values-dev.yaml, since the dashboard only needs to exist once,
# not once per namespace - see templates/grafana-dashboard-configmap.yaml.
grafanaDashboard:
  enabled: false

# Added in v8.1: controls whether this Release installs the app-level
# PrometheusRule (error rate, Open-Meteo latency/errors, cache hit ratio -
# see templates/prometheusrule-app.yaml). Left on for every environment,
# unlike grafanaDashboard above, since alerting genuinely needs to run once
# per namespace - a slow Open-Meteo call in production shouldn't go unnoticed
# just because dev already has its own copy of this rule.
alerting:
  enabled: true
