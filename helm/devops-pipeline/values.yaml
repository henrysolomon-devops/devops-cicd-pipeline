# Default configuration values for the devops-pipeline Helm chart.
# These values fill in the placeholders inside templates/deployment.yaml
# and templates/service.yaml. Per-environment files (values-dev.yaml,
# values-staging.yaml, values-production.yaml) will override specific
# values below for each namespace.

# Number of Pod replicas. Matches the replica count used in v2's
# k8s/deployment.yaml (kubectl-based, same value across all namespaces there).
replicaCount: 2

# Container image settings.
image:
  # Same image built and tested with Docker in v1 (no registry needed yet,
  # since kind loads it directly into the cluster with "kind load docker-image").
  repository: devops-cicd-pipeline
  pullPolicy: IfNotPresent
  # Explicitly set the tag here instead of relying on Chart.yaml's appVersion,
  # so the image version used is obvious directly from this file.
  tag: "v1.0.0"

# No private registry is used yet, so no pull secrets are needed.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# No custom ServiceAccount is needed for this project yet.
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Service configuration, matching k8s/service.yaml from v2:
# ClusterIP on port 80, forwarding to the container's port 5000.
service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Liveness/readiness probes, matching k8s/deployment.yaml from v2:
# both check GET /health on the container's port 5000.
livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}