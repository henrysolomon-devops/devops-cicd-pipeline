# Skips host key confirmation prompts. Reasonable here because this
# server's IP changes almost every time it gets rebuilt during this
# project, and it's a throwaway learning box rather than something
# that stays up long-term - not a setting I'd use for a real server.
[defaults]
host_key_checking = False

# During v7 testing, tasks kept failing mid-play with "Shared connection
# closed" - Ansible's default SSH multiplexing (ControlPersist) reusing
# one connection across tasks, which turned out to be unreliable over
# this particular connection. Instance size, apt lock timeouts, and
# disabling unattended-upgrades on the server were all tried first and
# made no difference, which pointed at the client side of the
# connection rather than the server. Turning multiplexing off entirely
# trades a little speed (a fresh SSH handshake per task) for not
# hitting this failure mode at all, which matters far more for a
# one-shot provisioning run than shaving off a few seconds. retries
# adds a safety net on top, in case any single connection attempt still
# has a bad moment.
[ssh_connection]
ssh_args = -o ControlMaster=no -o ServerAliveInterval=30
retries = 5