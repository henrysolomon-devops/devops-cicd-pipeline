---
# Installs k3s on the EC2 instance CloudFormation just created. k3s ships
# its own install script that handles the binary, the systemd service,
# and the internal networking in one shot - way less moving parts than a
# full kubeadm-based Kubernetes install.
- name: Install k3s on the pipeline server
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # A freshly created EC2 instance answers SSH well before it's truly
    # done booting - cloud-init or an automatic first-boot update can
    # still restart networking or sshd right out from under a connection
    # that looked fine a second earlier. This keeps retrying a real
    # connection until it holds steady, instead of moving on after one
    # lucky handshake (which is what "Gathering Facts" succeeding once,
    # then the next task failing with "Shared connection closed", means).
    - name: Wait until SSH is reliably reachable, not just reachable once
      wait_for_connection:
        delay: 10
        timeout: 180

    - name: Now that the connection is stable, gather facts
      setup:

    - name: Update the apt package cache
      apt:
        update_cache: true
        # Waits out cloud-init's own first-boot apt/unattended-upgrades
        # activity on a freshly launched instance, rather than racing it
        # and hitting a lock error.
        lock_timeout: 180

    # Added in v9. Kubernetes only allows NodePort values between
    # 30000-32767 by default, but the ALB's Target Groups are configured
    # against the same 5000/5001/5002 ports this project has used since
    # v1, and there was no real reason to abandon that just because the
    # traffic now arrives through a load balancer instead of directly.
    # This flag widens the allowed range on the API server itself so
    # those specific ports become valid NodePort values. --disable
    # traefik is here too: Traefik is k3s's own default ingress
    # controller, and it automatically claims a NodePort for itself the
    # moment it starts up - completely harmless when the valid NodePort
    # range was the huge 30000-32767 default, but a real problem now
    # that the range has been narrowed to just three ports. Traefik was
    # grabbing 5000 and 5001 for itself before the app's own Services
    # ever got a chance to claim them. It's also simply not needed
    # anymore - the ALB is the actual front door now, and Traefik was
    # never part of that path to begin with.
    - name: Download and run the official k3s install script
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--tls-san {{ tls_san }} --kube-apiserver-arg=service-node-port-range=5000-5010 --disable traefik" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for the k3s service to be active
      systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait until the node reports Ready
      shell: k3s kubectl get nodes
      register: node_status
      until: "'Ready' in node_status.stdout"
      retries: 10
      delay: 5

    - name: Show the node status
      debug:
        var: node_status.stdout_lines
