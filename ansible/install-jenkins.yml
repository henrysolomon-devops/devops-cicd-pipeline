---
# Installs Jenkins on the new jenkins-server EC2 instance, entirely from
# code, so a fresh server from every destroy/apply cycle ends up with
# the exact same setup automatically - no manual click-through in the
# setup wizard, matching the same "no manual setup" rule used for k3s
# in v5, and ArgoCD back in v6.
#
# Two extra-vars are required when this playbook is run:
#   kubeconfig_src - local path (on the machine running Ansible) to the
#                    app server's kubeconfig, already fetched by
#                    deploy-k3s.sh. Copied onto this box so Jenkins can
#                    reach the k3s API directly - no SSH between the
#                    two servers needed for that, just this file plus
#                    the standing security group rule set up in
#                    Terraform.
#   ghcr_pat       - a GitHub PAT scoped to packages:write, used by the
#                    pipeline to push images to ghcr.io. Jenkins runs
#                    outside GitHub Actions, so it can't use the
#                    automatic GITHUB_TOKEN the way deploy.yml used to -
#                    this is the one real secret JCasC needs.
- name: Install Jenkins on the Jenkins server
  hosts: all
  become: true
  gather_facts: false

  vars:
    jenkins_home: /var/lib/jenkins
    casc_dir: "{{ jenkins_home }}/casc_configs"
    secrets_dir: "{{ jenkins_home }}/casc_secrets"
    plugin_manager_version: "2.15.0"

  tasks:
    # Same reasoning as install-k3s.yml - this box is just as freshly
    # booted, so it gets the same guard against connecting before sshd
    # has actually settled down.
    - name: Wait until SSH is reliably reachable, not just reachable once
      wait_for_connection:
        delay: 10
        timeout: 180

    - name: Now that the connection is stable, gather facts
      setup:

    - name: Update the apt package cache
      apt:
        update_cache: true
        # A fresh Ubuntu image runs its own unattended-upgrades right
        # after boot, which holds the dpkg lock for a while. Without
        # this, Ansible's apt module gives up on that lock almost
        # immediately - this makes it wait the lock out instead of
        # failing (or, worse, sitting silently long enough for the SSH
        # connection itself to be treated as dead).
        lock_timeout: 180

    # Jenkins' current LTS line requires Java 21, and needs Java
    # installed *before* Jenkins itself - installing Jenkins first and
    # adding Java afterward leaves the service unable to start.
    - name: Install Java, which Jenkins itself needs to run
      apt:
        name:
          - fontconfig
          - openjdk-21-jre
        state: present
        lock_timeout: 180

    # Needed for the pipeline's build stage later - Jenkins itself
    # doesn't touch Docker, but the Jenkinsfile it runs will.
    - name: Install Docker, so the pipeline can build the app's image
      apt:
        name: docker.io
        state: present
        lock_timeout: 180

    - name: Add the Jenkins apt signing key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add the Jenkins apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: true
        lock_timeout: 180

    # apt starts Jenkins immediately after installing it, straight into
    # the interactive setup wizard with zero plugins. Stopping it here
    # gives us a clean window to install plugins and drop the JCasC
    # config in place before Jenkins ever starts for real.
    - name: Stop Jenkins right after install, before it reaches the setup wizard
      systemd:
        name: jenkins
        state: stopped

    - name: Let the jenkins user actually use Docker
      user:
        name: jenkins
        groups: docker
        append: true

    - name: Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Install Helm
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Create the kubeconfig directory for the jenkins user
      file:
        path: "{{ jenkins_home }}/.kube"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    # This one file is the only thing Jenkins needs to reach the k3s
    # API on app_server directly - it already carries the cluster's
    # address and certificate, so no SSH between the two servers is
    # needed here, just this file plus the standing security group
    # rule opened in Terraform.
    - name: Copy the app server's kubeconfig onto this box
      copy:
        src: "{{ kubeconfig_src }}"
        dest: "{{ jenkins_home }}/.kube/config"
        owner: jenkins
        group: jenkins
        mode: "0600"

    - name: Create the JCasC config directory
      file:
        path: "{{ casc_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Copy the JCasC configuration into place
      copy:
        src: ../jenkins/jenkins.yaml
        dest: "{{ casc_dir }}/jenkins.yaml"
        owner: jenkins
        group: jenkins
        mode: "0644"

    # JCasC's directory-based secret source: each file name here becomes
    # a secret ID that jenkins.yaml can reference as ${FILE_NAME}. This
    # is what keeps the actual GHCR token out of jenkins.yaml and out
    # of git entirely.
    - name: Create the JCasC secrets directory
      file:
        path: "{{ secrets_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Write the GHCR push token into the secrets directory
      copy:
        content: "{{ ghcr_pat }}"
        dest: "{{ secrets_dir }}/GHCR_PAT"
        owner: jenkins
        group: jenkins
        mode: "0600"

    - name: Download the Jenkins plugin manager tool
      get_url:
        url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ plugin_manager_version }}/jenkins-plugin-manager-{{ plugin_manager_version }}.jar"
        dest: /opt/jenkins-plugin-manager.jar
        mode: "0644"

    - name: Copy the plugin list into place
      copy:
        src: ../jenkins/plugins.txt
        dest: /opt/plugins.txt
        mode: "0644"

    - name: Make sure the plugins directory exists before installing into it
      file:
        path: "{{ jenkins_home }}/plugins"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    # Installs configuration-as-code itself plus everything jenkins.yaml
    # depends on, straight into the plugins folder Jenkins reads from -
    # no web UI, no "Manage Plugins" screen, no restart-and-click.
    - name: Install the plugins JCasC and the pipeline need
      command: >
        java -jar /opt/jenkins-plugin-manager.jar
        --war /usr/share/java/jenkins.war
        --plugin-download-directory {{ jenkins_home }}/plugins
        --plugin-file /opt/plugins.txt

    - name: Make sure the jenkins user owns everything it needs to read
      file:
        path: "{{ item }}"
        owner: jenkins
        group: jenkins
        recurse: true
      loop:
        - "{{ jenkins_home }}/plugins"
        - "{{ casc_dir }}"
        - "{{ secrets_dir }}"

    # The officially documented way to add environment variables to the
    # Jenkins systemd service, matching how the Jenkins docs themselves
    # show changing the port. Three things live here: skipping the
    # interactive setup wizard entirely, and pointing JCasC at both the
    # config file and the secrets directory above.
    - name: Create the systemd override directory
      file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Point Jenkins at JCasC and skip the interactive setup wizard
      copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false"
          Environment="CASC_JENKINS_CONFIG={{ casc_dir }}/jenkins.yaml"
          Environment="SECRETS={{ secrets_dir }}"

    - name: Start Jenkins for real, now that plugins and JCasC are both in place
      systemd:
        name: jenkins
        state: started
        enabled: true
        daemon_reload: true

    # Jenkins can take a little while to come up on a fresh t3.micro,
    # especially while it's also applying the JCasC config for the
    # first time, so this waits until it's actually answering instead
    # of assuming it is.
    - name: Wait for Jenkins to come up
      uri:
        url: "http://localhost:8080/login"
        status_code: 200
      register: jenkins_status
      until: jenkins_status.status == 200
      retries: 30
      delay: 10
