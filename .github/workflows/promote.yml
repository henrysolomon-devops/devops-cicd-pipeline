# This is how a tested image tag actually moves forward from dev to
# staging, and from staging to production. It's never triggered by a
# push - only by hand, whenever I've tested the current environment and
# decided the same image is ready to move to the next one.
#
# Unlike deploy.yml's dev job, this workflow does NOT merge its own pull
# request. It opens the PR and stops there - reviewing and merging it is
# the actual approval step for staging and production, replacing the
# old GitHub Environment "click to approve" gate entirely.
#
# Before opening that PR, it also checks that the tag being promoted is
# really the one currently running one stage back (dev, for a staging
# promotion; staging, for a production promotion). This exists purely
# to catch a simple mistake - picking "production" when "staging" was
# meant - before anything gets proposed for the wrong environment.

name: Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment is this tag being promoted to?"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "The image tag (commit SHA) to promote - the same one already tested in the previous environment"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # staging can only receive a tag that's already running in dev;
      # production can only receive a tag that's already running in
      # staging. This is what actually enforces the promotion order -
      # picking the wrong environment by mistake fails here instead of
      # silently proposing a change nobody tested yet.
      - name: Work out which environment comes before this one
        id: previous
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            echo "file=helm/devops-pipeline/values-dev.yaml" >> "$GITHUB_OUTPUT"
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "file=helm/devops-pipeline/values-staging.yaml" >> "$GITHUB_OUTPUT"
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm this tag is actually running in the previous environment
        run: |
          CURRENT_TAG=$(grep 'tag:' "${{ steps.previous.outputs.file }}" | sed -E 's/.*tag: *"?([^"]*)"?.*/\1/')
          if [ "$CURRENT_TAG" != "${{ inputs.image_tag }}" ]; then
            echo "::error::Tag ${{ inputs.image_tag }} isn't the one currently running in ${{ steps.previous.outputs.name }} (found $CURRENT_TAG instead). Promote it to ${{ steps.previous.outputs.name }} first."
            exit 1
          fi
          echo "Confirmed - ${{ inputs.image_tag }} is currently running in ${{ steps.previous.outputs.name }}."

      - name: Set git identity for the automated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create a branch and update the target environment's image tag
        id: branch
        run: |
          BRANCH="promote-${{ inputs.environment }}-${{ inputs.image_tag }}"
          TARGET_FILE="helm/devops-pipeline/values-${{ inputs.environment }}.yaml"
          git checkout -b "$BRANCH"
          sed -i "s/tag:.*/tag: \"${{ inputs.image_tag }}\"/" "$TARGET_FILE"
          git add "$TARGET_FILE"
          git commit -m "Promote ${{ inputs.image_tag }} to ${{ inputs.environment }}"
          git push origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # This PR is deliberately left open - reviewing the diff and
      # merging it, by hand, is what actually approves this promotion.
      # No auto-merge here, unlike deploy.yml's dev job.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Promote ${{ inputs.image_tag }} to ${{ inputs.environment }}" \
            --body "Tag \`${{ inputs.image_tag }}\` was confirmed running in ${{ steps.previous.outputs.name }}. Merging this PR is what approves the promotion to ${{ inputs.environment }} - ArgoCD picks it up automatically once merged."
