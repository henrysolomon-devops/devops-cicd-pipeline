# This is how a tested image tag actually moves forward from dev to
# staging, and from staging to production. It's never triggered by a
# push - only by hand, whenever I've tested the current environment and
# decided it's ready to move to the next one.
#
# Unlike deploy.yml's dev job, this workflow does NOT merge its own pull
# request. It opens the PR and stops there - reviewing and merging it is
# the actual approval step for staging and production, replacing the
# old GitHub Environment "click to approve" gate entirely.
#
# There's no manual "which tag" input here on purpose. The tag to
# promote is read directly from the previous environment's values file
# at the moment this runs - dev's file for a staging promotion,
# staging's file for a production promotion - so it's always whatever
# is actually running right now, never something typed in by hand that
# could already be stale by the time the workflow starts.

name: Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment is this being promoted to?"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # staging always gets whatever tag is currently running in dev;
      # production always gets whatever tag is currently running in
      # staging. Reading it live like this, instead of taking it as an
      # input, is what guarantees it's never a stale value.
      - name: Work out which environment comes before this one
        id: previous
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            echo "file=helm/devops-pipeline/values-dev.yaml" >> "$GITHUB_OUTPUT"
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "file=helm/devops-pipeline/values-staging.yaml" >> "$GITHUB_OUTPUT"
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the tag currently running in the previous environment
        id: tag
        run: |
          CURRENT_TAG=$(grep 'tag:' "${{ steps.previous.outputs.file }}" | sed -E 's/.*tag: *"?([^"]*)"?.*/\1/')
          echo "value=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "Promoting $CURRENT_TAG from ${{ steps.previous.outputs.name }} to ${{ inputs.environment }}."

      - name: Set git identity for the automated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create a branch and update the target environment's image tag
        id: branch
        run: |
          BRANCH="promote-${{ inputs.environment }}-${{ steps.tag.outputs.value }}"
          TARGET_FILE="helm/devops-pipeline/values-${{ inputs.environment }}.yaml"
          # Same reasoning as deploy.yml - if a previous attempt already
          # pushed this branch and failed at a later step, clear it out
          # first so this run doesn't get rejected over diverged history.
          git push origin --delete "$BRANCH" || true
          git checkout -b "$BRANCH"
          sed -i "s/tag:.*/tag: \"${{ steps.tag.outputs.value }}\"/" "$TARGET_FILE"
          git add "$TARGET_FILE"
          git commit -m "Promote ${{ steps.tag.outputs.value }} to ${{ inputs.environment }}"
          git push origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # This PR is deliberately left open - reviewing the diff and
      # merging it, by hand, is what actually approves this promotion.
      # No auto-merge here, unlike deploy.yml's dev job.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Promote ${{ steps.tag.outputs.value }} to ${{ inputs.environment }}" \
            --body "Tag \`${{ steps.tag.outputs.value }}\` is what's currently running in ${{ steps.previous.outputs.name }}. Merging this PR is what approves the promotion to ${{ inputs.environment }} - ArgoCD picks it up automatically once merged."
