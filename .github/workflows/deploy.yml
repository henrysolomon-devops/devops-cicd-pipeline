# This workflow handles the full CI/CD flow for the project.
# Every push to main builds a fresh image, pushes it to GitHub Container
# Registry, and then rolls it out to dev, staging, and production in
# that order - one after another, never all at once. Staging and
# production both require a manual approval before they proceed, since
# those are the environments we don't want to touch without a human
# actually checking things first.

name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}  # Temporary - lets us trigger this manually from
                          # the Actions tab for testing, before merging to
                          # main. Will be removed once everything's confirmed working.

env:
  # Using the commit SHA as the image tag (instead of "latest") so we
  # always know exactly which commit is running in each environment.
  IMAGE_NAME: ghcr.io/henrysolomon-devops/devops-cicd-pipeline

jobs:
  build:
    # This job only builds and pushes the image - it doesn't touch
    # Kubernetes at all. Keeping it separate from deployment makes it
    # easier to tell, at a glance, whether a failure was a build
    # problem or a deployment problem.
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GITHUB_TOKEN is created automatically for every run, so there's
      # no need to store a separate secret just to log in to ghcr.io.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -f docker/Dockerfile .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy-dev:
    # Dev has no protection rules, so this runs immediately after the
    # build finishes - no approval needed, since this is just an early
    # testing environment.
    needs: build
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev namespace
        run: |
          helm upgrade --install devops-pipeline helm/devops-pipeline \
            -f helm/devops-pipeline/values-dev.yaml \
            --set image.repository=$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            -n dev

  deploy-staging:
    # This is where the workflow pauses and waits for a manual
    # approval, since staging has a required reviewer set up. Nothing
    # happens here until that approval is given in the Actions tab.
    needs: deploy-dev
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging namespace
        run: |
          helm upgrade --install devops-pipeline helm/devops-pipeline \
            -f helm/devops-pipeline/values-staging.yaml \
            --set image.repository=$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            -n staging

  deploy-production:
    # Same idea as staging - this waits for its own separate approval
    # before touching the production namespace. Two approvals in a row
    # (staging, then production) means there are two real chances to
    # catch a problem before it reaches the live version.
    needs: deploy-staging
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production namespace
        run: |
          helm upgrade --install devops-pipeline helm/devops-pipeline \
            -f helm/devops-pipeline/values-production.yaml \
            --set image.repository=$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            -n production