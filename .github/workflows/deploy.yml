# This workflow now only handles the CI half of CI/CD - it builds the
# image and pushes it to GitHub Container Registry, then hands off to
# ArgoCD for the actual deployment. It never talks to the Kubernetes
# cluster directly anymore, and it never needs a kubeconfig, a security
# group, or any AWS credentials to get an image running - ArgoCD, which
# lives inside the cluster itself, takes care of that part on its own by
# watching this repo.
#
# dev gets updated automatically the moment a build finishes - through a
# pull request that this workflow opens and immediately merges itself,
# since main's branch protection means even an automated change has to
# go through a PR, not a direct push. staging and production are handled
# by a separate workflow (promote.yml), triggered by hand once dev has
# been tested, and their PRs are left open for a real review and merge.

name: Build and Deploy

on:
  push:
    branches:
      - main
    # These three files are only ever changed by automation (this
    # workflow, or promote.yml) - never by hand as part of an app code
    # change. Without ignoring them here, merging one of those automated
    # PRs would trigger this whole workflow again, which would build a
    # pointless duplicate image and try to update the same file again,
    # forever.
    paths-ignore:
      - "helm/devops-pipeline/values-dev.yaml"
      - "helm/devops-pipeline/values-staging.yaml"
      - "helm/devops-pipeline/values-production.yaml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/henrysolomon-devops/devops-cicd-pipeline

jobs:
  build:
    # Still just builds and pushes the image - doesn't touch Git or
    # Kubernetes at all, so a build problem stays easy to tell apart
    # from anything happening further down the pipeline.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This keeps the human-readable version shown on the dashboard
      # (e.g. "6.0.0") separate from the image tag used in ghcr.io
      # (the commit SHA). The SHA is what guarantees every build is
      # unique and traceable; the VERSION file is just for people
      # reading the dashboard, and only changes when I bump it by hand
      # before tagging a new release.
      - name: Read the current app version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.value }} \
            -t $IMAGE_NAME:${{ github.sha }} \
            -f docker/Dockerfile .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

  # Doesn't do anything by itself - just sits here and waits for me to
  # confirm, through the infra-check environment, that I've actually
  # run infra.yml and the AWS server (and ArgoCD on top of it) is up
  # before anything tries to point a change at it.
  infra-check:
    needs: build
    runs-on: ubuntu-latest
    environment: infra-check

    steps:
      - name: Confirmed - infrastructure is up
        run: echo "Proceeding, infrastructure has been confirmed ready."

  deploy-dev:
    # No protection rules on dev, so this opens its own PR and merges
    # it right away, without waiting for anyone. "build" is listed
    # directly here too (not just via infra-check), since a job can
    # only read another job's outputs if that job is a direct entry in
    # its own needs list - a job two steps upstream doesn't count, even
    # if the ordering still works out.
    needs: [build, infra-check]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set git identity for the automated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create a branch and update the dev image tag
        run: |
          BRANCH="bump-dev-${{ needs.build.outputs.image_tag }}"
          git checkout -b "$BRANCH"
          sed -i "s/tag:.*/tag: \"${{ needs.build.outputs.image_tag }}\"/" \
            helm/devops-pipeline/values-dev.yaml
          git add helm/devops-pipeline/values-dev.yaml
          git commit -m "Bump dev image tag to ${{ needs.build.outputs.image_tag }}"
          git push origin "$BRANCH"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bump-dev-${{ needs.build.outputs.image_tag }}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Bump dev image tag to ${{ needs.build.outputs.image_tag }}" \
            --body "Automated tag bump for dev, no review needed since dev has no approval gate."
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Dev has no approval gate by design, so this merges its own PR
      # immediately rather than leaving it open for someone to click.
      # It still goes through a real PR first, though, since main's
      # branch protection doesn't allow a direct push even from
      # automation.
      - name: Merge the pull request immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.branch }}" --squash --delete-branch
