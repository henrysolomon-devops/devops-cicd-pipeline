name: Infrastructure (CloudFormation + EKS)

# Still manual, still gated behind the aws-infra environment - this
# touches real AWS money and a real cluster, so it never fires on its
# own just because someone pushed to main.
#
# Rewritten in v10 for the move to EKS. The biggest structural change
# from v9: there's no Ansible step anywhere in this file anymore. k3s
# needed Ansible because Terraform (and then CloudFormation) only ever
# built a bare EC2 instance - something still had to SSH in afterward
# and actually install Kubernetes. EKS Managed Node Groups don't have
# that gap: AWS resolves the AMI, runs the bootstrap script, and joins
# the node to the cluster automatically, all as part of the
# `aws cloudformation deploy` call itself. There's also no SSH key
# anywhere in this workflow anymore, and no temporary security-group
# hole opened for this runner's IP - administrative access to the
# cluster now comes entirely from IAM, through the EKS Access Entry
# created in cloudformation/eks-cluster-stack.yaml.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do with the AWS infrastructure?"
        required: true
        type: choice
        options:
          - apply
          - destroy

# Needed so this workflow can request a short-lived OIDC token from
# GitHub and hand it to AWS instead of using a stored access key.
permissions:
  id-token: write
  contents: read

# Just a safety net so two runs of this can't step on each other's
# feet if I accidentally kick it off twice.
concurrency:
  group: infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: devops-pipeline-eks

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: aws-infra

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # New in v10, deliberately separate from v9's
      # github-actions-cloudformation-role - that role is left
      # completely alone so the v9.0.0 tag can still be checked out and
      # applied entirely on its own, without anything in this workflow
      # affecting it.
      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::578254188866:role/github-actions-eks-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Work out this account's ID and this role's own ARN
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          # Built directly from the account ID and the role's fixed
          # name, rather than read back from `aws sts get-caller-identity
          # --query Arn` - that command returns an STS assumed-role
          # session ARN (arn:aws:sts::...:assumed-role/...), not the
          # actual IAM role ARN the EKS Access Entry in
          # eks-cluster-stack.yaml needs as its PrincipalArn.
          echo "eks_role_arn=arn:aws:iam::${ACCOUNT_ID}:role/github-actions-eks-role" >> "$GITHUB_OUTPUT"

      - name: Install kubectl
        if: inputs.action == 'apply'
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        if: inputs.action == 'apply'
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh
          rm get_helm.sh

      # ---------- apply path ----------

      # First of four stacks, unchanged in spirit from v9 - just the two
      # EKS-discovery tags added to both subnets now (see
      # network-stack.yaml itself for why). No CAPABILITY_NAMED_IAM
      # needed, same as before - still just a VPC, subnets, and routing.
      # aws cloudformation deploy refuses to update a stack stuck in
      # ROLLBACK_COMPLETE (the state a stack lands in after its very
      # first create attempt fails) - it has to be deleted first, then
      # recreated from scratch. This check runs before every stack
      # deploy below so a failed first attempt on any of the four
      # stacks never needs a manual delete-stack run by hand before
      # retrying.
      - name: Clear the network stack if it's stuck in ROLLBACK_COMPLETE
        if: inputs.action == 'apply'
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name devops-pipeline-network \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack is stuck in ROLLBACK_COMPLETE, deleting it before retrying."
            aws cloudformation delete-stack --stack-name devops-pipeline-network
            aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-network
          fi

      - name: Deploy the network stack
        if: inputs.action == 'apply'
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name devops-pipeline-network \
            --parameter-overrides \
              EksClusterName="${{ env.EKS_CLUSTER_NAME }}"

      # The OIDC provider's certificate thumbprint has to be computed
      # fresh rather than hardcoded (see eks-cluster-stack.yaml's own
      # parameter description for why), but it doesn't actually need
      # the cluster to exist yet - it's the thumbprint of the regional
      # oidc.eks.<region>.amazonaws.com endpoint's own TLS certificate
      # chain, which is identical for every EKS cluster in this region,
      # not something specific to this cluster's own issuer path. That's
      # what makes it safe to compute this before the cluster stack
      # below even runs.
      - name: Compute the EKS OIDC provider's certificate thumbprint
        if: inputs.action == 'apply'
        id: thumbprint
        run: |
          THUMBPRINT=$(echo | openssl s_client -servername "oidc.eks.${{ env.AWS_REGION }}.amazonaws.com" \
            -connect "oidc.eks.${{ env.AWS_REGION }}.amazonaws.com:443" -showcerts 2>/dev/null \
            | openssl x509 -in /dev/stdin -fingerprint -sha1 -noout \
            | sed 's/^.*Fingerprint=//' | tr -d ':')
          echo "value=$THUMBPRINT" >> "$GITHUB_OUTPUT"

      # Second stack, and the biggest one - the EKS control plane
      # itself, its Managed Node Group, the OIDC provider every IRSA
      # role depends on, and the Access Entry that makes this same
      # role a cluster admin. CAPABILITY_NAMED_IAM is required since
      # this template creates two IAM roles with names it chooses
      # itself (EksClusterRole, NodeGroupRole).
      - name: Clear the EKS cluster stack if it's stuck in ROLLBACK_COMPLETE
        if: inputs.action == 'apply'
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name devops-pipeline-eks \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack is stuck in ROLLBACK_COMPLETE, deleting it before retrying."
            aws cloudformation delete-stack --stack-name devops-pipeline-eks
            aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-eks
          fi

      - name: Deploy the EKS cluster stack
        if: inputs.action == 'apply'
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/eks-cluster-stack.yaml \
            --stack-name devops-pipeline-eks \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              EksClusterName="${{ env.EKS_CLUSTER_NAME }}" \
              MyIp="${{ vars.MY_IP }}" \
              GithubActionsRoleArn="${{ steps.account.outputs.eks_role_arn }}" \
              OidcProviderThumbprint="${{ steps.thumbprint.outputs.value }}"

      - name: Read the OIDC provider's issuer URL back out of the cluster stack
        if: inputs.action == 'apply'
        id: oidc
        run: |
          OIDC_URL=$(aws cloudformation describe-stacks \
            --stack-name devops-pipeline-eks \
            --query "Stacks[0].Outputs[?OutputKey=='OidcProviderUrl'].OutputValue" \
            --output text)
          echo "url=$OIDC_URL" >> "$GITHUB_OUTPUT"

      # Third stack - the three IRSA roles (Loki, the AWS Load Balancer
      # Controller, Grafana). CAPABILITY_NAMED_IAM again, for the same
      # reason as the cluster stack: three named IAM roles, plus the
      # standalone managed policy the Load Balancer Controller's role
      # attaches.
      - name: Clear the IRSA stack if it's stuck in ROLLBACK_COMPLETE
        if: inputs.action == 'apply'
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name devops-pipeline-irsa \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack is stuck in ROLLBACK_COMPLETE, deleting it before retrying."
            aws cloudformation delete-stack --stack-name devops-pipeline-irsa
            aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-irsa
          fi

      - name: Deploy the IRSA stack
        if: inputs.action == 'apply'
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-irsa-stack.yaml \
            --stack-name devops-pipeline-irsa \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              OidcProviderUrl="${{ steps.oidc.outputs.url }}"

      # Writes a real kubeconfig to the same path every later step in
      # this file already assumes (~/.kube/devops-pipeline-config) -
      # nothing below this step had to change just because the
      # mechanism for getting cluster access changed from an SSH-copied
      # k3s kubeconfig to this. Access itself comes from this role's own
      # IAM identity, authorized by the Access Entry created in the
      # cluster stack above - no kubeconfig secret, no certificate to
      # manage by hand.
      - name: Write a kubeconfig for the new cluster
        if: inputs.action == 'apply'
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --kubeconfig ~/.kube/devops-pipeline-config

      - name: Create the three environment namespaces
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      # New in v10. Installed early, before kube-prometheus-stack and
      # well before ArgoCD, since the app chart's own Ingress
      # (helm/devops-pipeline/templates/ingress.yaml) needs this
      # controller already watching the cluster before ArgoCD ever
      # syncs it - the same CRD/controller-before-consumer ordering
      # reason the ServiceMonitor CRD had to exist before ArgoCD synced
      # back in v8.
      - name: Add the eks-charts Helm repo and install its CRDs
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          kubectl apply -k "github.com/aws/eks-charts/stable/aws-load-balancer-controller/crds?ref=master"

      - name: Get the VPC ID and the Load Balancer Controller's IRSA role ARN
        if: inputs.action == 'apply'
        id: alb
        run: |
          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name devops-pipeline-network \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" \
            --output text)
          ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name devops-pipeline-irsa \
            --query "Stacks[0].Outputs[?OutputKey=='AwsLoadBalancerControllerIrsaRoleArn'].OutputValue" \
            --output text)
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      # region and vpcId are passed explicitly rather than left for the
      # controller to auto-discover - auto-discovery needs a couple of
      # extra EC2 describe permissions and a specific set of instance
      # metadata tags to work reliably, and since this workflow already
      # knows both values exactly, there's no reason to lean on
      # discovery instead of just stating them.
      - name: Install the AWS Load Balancer Controller
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version 3.5.0 \
            --namespace kube-system \
            --set clusterName="${{ env.EKS_CLUSTER_NAME }}" \
            --set region="${{ env.AWS_REGION }}" \
            --set vpcId="${{ steps.alb.outputs.vpc_id }}" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="${{ steps.alb.outputs.role_arn }}" \
            --wait --timeout 5m

      # The controller's own readiness probe passing (which the --wait
      # flag above already confirmed) doesn't guarantee its self-signed
      # webhook certificate has finished being generated and patched
      # into the MutatingWebhookConfiguration yet - that happens as a
      # separate internal startup step, not something the readiness
      # probe waits on. Anything that creates a Service shortly after
      # (kube-prometheus-stack's Grafana Service, right after this)
      # gets routed through that webhook, and a request arriving before
      # the certificate is actually in place fails with a TLS
      # "signed by unknown authority" error - not a real permissions or
      # config problem, just a timing gap this sleep closes.
      - name: Give the Load Balancer Controller's webhook certificate time to settle
        if: inputs.action == 'apply'
        run: sleep 30

      - name: Add the prometheus-community Helm repo
        if: inputs.action == 'apply'
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      # Renders the real Slack webhook URLs into a throwaway copy of
      # monitoring/alertmanager-config.yaml, unchanged in spirit since
      # v8.1 - only ever exists for the lifetime of this job, never
      # logged, committed, or uploaded as an artifact.
      - name: Render the Alertmanager Slack webhook config
        if: inputs.action == 'apply'
        run: |
          sed \
            -e "s|__SLACK_WEBHOOK_INFRA__|${{ secrets.SLACK_WEBHOOK_INFRA }}|" \
            -e "s|__SLACK_WEBHOOK_APP__|${{ secrets.SLACK_WEBHOOK_APP }}|" \
            monitoring/alertmanager-config.yaml > monitoring/alertmanager-config.rendered.yaml

      # New in v10: the same rendering approach as the Slack webhooks
      # above, applied to monitoring/values.yaml itself now, since
      # Grafana's serviceAccount annotation carries an IRSA role ARN
      # with a __AWS_ACCOUNT_ID__ placeholder in the committed file (see
      # that file's own comments for why the account ID is the only
      # unknown part of an otherwise fully predictable ARN).
      - name: Render the account ID into the kube-prometheus-stack values
        if: inputs.action == 'apply'
        run: |
          sed \
            -e "s|__AWS_ACCOUNT_ID__|${{ steps.account.outputs.id }}|" \
            monitoring/values.yaml > monitoring/values.rendered.yaml

      - name: Install kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 88.1.5 \
            --namespace monitoring --create-namespace \
            -f monitoring/values.rendered.yaml \
            -f monitoring/alertmanager-config.rendered.yaml \
            --wait --timeout 10m

      - name: Apply the infra-level alerting rules
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -f monitoring/prometheusrule-infra.yaml

      - name: Add the grafana Helm repo
        if: inputs.action == 'apply'
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      # Same __AWS_ACCOUNT_ID__ substitution as monitoring/values.yaml
      # above, this time for Loki's own serviceAccount annotation - see
      # monitoring/loki-values.yaml's comments for the full reasoning on
      # why IRSA replaces the old IAM Instance Profile here.
      - name: Render the account ID into the Loki values
        if: inputs.action == 'apply'
        run: |
          sed \
            -e "s|__AWS_ACCOUNT_ID__|${{ steps.account.outputs.id }}|" \
            monitoring/loki-values.yaml > monitoring/loki-values.rendered.yaml

      - name: Install Loki
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install loki grafana/loki \
            --version 6.27.0 \
            --namespace monitoring --create-namespace \
            -f monitoring/loki-values.rendered.yaml \
            --wait --timeout 10m

      - name: Install Grafana Alloy
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install alloy grafana/alloy \
            --version 0.12.5 \
            --namespace monitoring --create-namespace \
            -f monitoring/alloy-values.yaml \
            --wait --timeout 10m

      - name: Create the argocd namespace
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: Install ArgoCD
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.2/manifests/install.yaml

      - name: Wait for ArgoCD to come up
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl wait --for=condition=available --timeout=180s deployment/argocd-server -n argocd
          kubectl wait --for=condition=available --timeout=180s deployment/argocd-repo-server -n argocd

      - name: Register the three environment Applications with ArgoCD
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -f argocd/dev-application.yaml
          kubectl apply -f argocd/staging-application.yaml
          kubectl apply -f argocd/production-application.yaml

      # Only the cluster name goes to SSM Parameter Store here, not the
      # ALB's DNS name the way the server's IP always was through v9.
      # That's a deliberate choice, not an oversight: the ALB doesn't
      # exist yet at this point in the workflow. It's created by the
      # Load Balancer Controller in response to an Ingress resource
      # that ArgoCD hasn't synced yet - ArgoCD's own sync is
      # asynchronous and happens on its own schedule after this job
      # finishes, so there's no reliable value to write here without
      # adding a polling loop of uncertain length. Once the apply run
      # finishes, the ALB's DNS name is one command away:
      # `kubectl get ingress <name> -n dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'`
      - name: Write the cluster name to SSM Parameter Store
        if: inputs.action == 'apply'
        run: |
          aws ssm put-parameter --name "/devops-pipeline/eks-cluster-name" \
            --value "${{ env.EKS_CLUSTER_NAME }}" --type String --overwrite

      # ---------- destroy path ----------

      # Needed even for destroy - deleting the Ingress resources below
      # requires cluster access, same as everything else in this file.
      # continue-on-error here is what makes the destroy path
      # idempotent. Discovered after a previous destroy run succeeded
      # but was left running/re-triggered - this step failed outright
      # with "No cluster found," halting the job before it ever
      # reached the (already-unnecessary, but harmless to attempt)
      # stack deletions below. Every step after this one already
      # tolerates a missing cluster on its own (kubectl calls use
      # --ignore-not-found or `|| true`, and CloudFormation's own
      # delete-stack/wait commands are no-ops against a stack that's
      # already gone), so letting this one step fail without stopping
      # the job is enough to make a repeated or redundant destroy run
      # safe rather than a hard failure.
      - name: Write a kubeconfig for the existing cluster
        if: inputs.action == 'destroy'
        continue-on-error: true
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --kubeconfig ~/.kube/devops-pipeline-config

      # This is the step the whole destroy order depends on. The AWS
      # Load Balancer Controller creates a real ALB, Target Groups, and
      # ENIs directly in this project's VPC and subnets - none of that
      # is CloudFormation's to know about or clean up. Deleting every
      # Ingress here is what tells the controller to tear the ALB down
      # on its own, before any CloudFormation stack starts deleting the
      # VPC underneath it. Skipping this (or deleting the EKS stack
      # first) would leave an orphaned ALB and ENIs still attached to
      # the subnets, and network-stack's own delete would then fail
      # with a dependency error.
      - name: Delete every Ingress so the Load Balancer Controller tears down the ALB
        if: inputs.action == 'destroy'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl delete ingress --all --all-namespaces --ignore-not-found --timeout=60s || true

      # The original version of this wait loop (10 tries, 10 seconds
      # apart - 100 seconds total) turned out to be nowhere near enough
      # on a real destroy run: the ALB was still ACTIVE when the loop
      # gave up, and network-stack's own deletion started anyway,
      # requiring a manual `aws elbv2 delete-load-balancer` and
      # `delete-target-group` to unblock it. Widened to 40 tries, 15
      # seconds apart - 10 minutes total, generous enough to cover a
      # real ALB deletion without needing to babysit this step by hand.
      - name: Wait for the ALB itself to actually disappear
        if: inputs.action == 'destroy'
        run: |
          for i in $(seq 1 40); do
            COUNT=$(aws elbv2 describe-load-balancers \
              --query "length(LoadBalancers[?contains(LoadBalancerName, 'k8s-devops')])" \
              --output text 2>/dev/null || echo "0")
            if [ "$COUNT" = "0" ]; then
              echo "ALB is gone."
              break
            fi
            echo "Still waiting on the ALB to be deleted (attempt $i/40)..."
            sleep 15
          done

      # Discovered on a real destroy run: the three per-environment
      # Target Groups can outlive the ALB itself even once it's fully
      # deleted - they're independent resources, not automatically
      # cleaned up just because the load balancer that referenced them
      # is gone. Deleting them explicitly here, rather than assuming
      # the controller already handled it, avoids leaving orphaned
      # Target Groups behind after every destroy.
      - name: Delete any leftover Target Groups
        if: inputs.action == 'destroy'
        run: |
          for tg in $(aws elbv2 describe-target-groups \
            --query "TargetGroups[?contains(TargetGroupName, 'k8s-dev') || contains(TargetGroupName, 'k8s-staging') || contains(TargetGroupName, 'k8s-producti')].TargetGroupArn" \
            --output text); do
            echo "Deleting target group: $tg"
            aws elbv2 delete-target-group --target-group-arn "$tg" || true
          done

      # Stacks come down in the exact reverse order they went up in.
      # The IRSA stack has to go first, specifically because it imports
      # the EKS cluster stack's OIDC provider ARN - CloudFormation won't
      # allow deleting a stack while another stack still has an active
      # Fn::ImportValue reference to one of its Exports.
      - name: Delete the IRSA stack
        if: inputs.action == 'destroy'
        run: aws cloudformation delete-stack --stack-name devops-pipeline-irsa

      - name: Wait for the IRSA stack to finish deleting
        if: inputs.action == 'destroy'
        run: aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-irsa

      - name: Delete the EKS cluster stack
        if: inputs.action == 'destroy'
        run: aws cloudformation delete-stack --stack-name devops-pipeline-eks

      - name: Wait for the EKS cluster stack to finish deleting
        if: inputs.action == 'destroy'
        run: aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-eks

      - name: Delete the network stack
        if: inputs.action == 'destroy'
        run: aws cloudformation delete-stack --stack-name devops-pipeline-network

      - name: Wait for the network stack to finish deleting
        if: inputs.action == 'destroy'
        run: aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-network
