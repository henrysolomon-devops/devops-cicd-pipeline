name: Infrastructure (CloudFormation + Ansible)

# This one's manual on purpose - it touches real AWS money, so it
# should never fire on its own just because someone pushed to main.
# I run it by hand, pick apply or destroy, and approve it myself
# through the aws-infra environment before anything actually happens.
#
# Rewritten in v9 to use CloudFormation instead of Terraform - see
# cloudformation/ for the three stacks this now deploys, in place of
# what used to live in terraform/. Everything below Ansible (namespaces,
# monitoring, ArgoCD) is untouched, since none of that ever cared which
# tool provisioned the server underneath it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do with the AWS infrastructure?"
        required: true
        type: choice
        options:
          - apply
          - destroy

# Needed so this workflow can request a short-lived OIDC token from
# GitHub and hand it to AWS instead of using a stored access key.
permissions:
  id-token: write
  contents: read

# Just a safety net so two runs of this can't step on each other's
# feet if I accidentally kick it off twice.
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: aws-infra

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # TEMPORARY - added only to diagnose the AssumeRoleWithWebIdentity
      # failure. Prints the actual sub/aud claims GitHub is sending, so
      # they can be compared directly against the trust policy instead
      # of guessing. Remove this step once the role is confirmed working.
      - name: DEBUG - show the real OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "
          import base64, json, sys
          token = sys.argv[1]
          payload = token.split('.')[1]
          padded = payload + '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(padded)), indent=2))
          " "$IDTOKEN"

      # This role is new in v9 and deliberately separate from the old
      # github-actions-terraform-role - that one is left completely
      # alone so any earlier tag (v5.1 through v8.1) can still be
      # checked out and applied on its own, without this workflow's
      # changes affecting it. See the account setup notes for exactly
      # what this role needs.
      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::578254188866:role/github-actions-cloudformation-role
          aws-region: us-east-1

      - name: Install Ansible
        if: inputs.action == 'apply'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # New in v8 - needed to install kube-prometheus-stack below. Same
      # install method used back in v3 for local Helm usage.
      - name: Install Helm
        if: inputs.action == 'apply'
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh
          rm get_helm.sh

      - name: Write out the SSH public key so CloudFormation can import it
        if: inputs.action == 'apply'
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.SSH_PUBLIC_KEY }}" > ~/.ssh/devops-pipeline-key.pub

      # ---------- apply path ----------

      # First of three stacks. No CAPABILITY_NAMED_IAM needed here -
      # this one only creates a VPC, subnets, and routing, nothing that
      # touches IAM.
      - name: Deploy the network stack
        if: inputs.action == 'apply'
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name devops-pipeline-network

      # Second stack. CAPABILITY_NAMED_IAM is required here specifically
      # because this template creates an IAM Role and Instance Profile
      # (for Loki's S3 access) with names it chooses itself, rather than
      # letting CloudFormation generate them - acknowledging that is
      # what the capability flag is actually for.
      - name: Deploy the compute stack
        if: inputs.action == 'apply'
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/compute-stack.yaml \
            --stack-name devops-pipeline-compute \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              MyIp="${{ vars.MY_IP }}" \
              PublicKeyMaterial="$(cat ~/.ssh/devops-pipeline-key.pub)"

      # Third and last stack. No IAM resources here either, so no
      # capability flag needed - just the ALB, its security group, the
      # target groups, and the listener rules.
      - name: Deploy the load balancer stack
        if: inputs.action == 'apply'
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/loadbalancer-stack.yaml \
            --stack-name devops-pipeline-loadbalancer

      # Added in v9, replacing the GitHub repo Variables that used to
      # hold this in the Terraform version - now that everything is
      # already living inside AWS, it makes more sense for these
      # operational values to live there too, in SSM Parameter Store,
      # rather than round-tripping through a GitHub API call.
      - name: Write server IP and ALB DNS name to SSM Parameter Store
        if: inputs.action == 'apply'
        run: |
          SERVER_IP=$(aws cloudformation describe-stacks \
            --stack-name devops-pipeline-compute \
            --query "Stacks[0].Outputs[?OutputKey=='ServerPublicIp'].OutputValue" \
            --output text)
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name devops-pipeline-loadbalancer \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDnsName'].OutputValue" \
            --output text)
          aws ssm put-parameter --name "/devops-pipeline/server-public-ip" \
            --value "$SERVER_IP" --type String --overwrite
          aws ssm put-parameter --name "/devops-pipeline/alb-dns-name" \
            --value "$ALB_DNS" --type String --overwrite

      - name: Look up the security group this run needs to touch
        if: inputs.action == 'apply'
        id: app_sg
        run: |
          SG_ID=$(aws cloudformation describe-stacks \
            --stack-name devops-pipeline-compute \
            --query "Stacks[0].Outputs[?OutputKey=='AppServerSecurityGroupId'].OutputValue" \
            --output text)
          echo "id=$SG_ID" >> "$GITHUB_OUTPUT"

      - name: Figure out this runner's own public IP
        if: inputs.action == 'apply'
        id: runner_ip
        run: echo "cidr=$(curl -s ifconfig.me)/32" >> "$GITHUB_OUTPUT"

      - name: Temporarily let this runner SSH into the app server, just long enough for Ansible
        if: inputs.action == 'apply'
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.cidr }}

      - name: Temporarily let this runner reach the k3s API too
        if: inputs.action == 'apply'
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 6443 \
            --cidr ${{ steps.runner_ip.outputs.cidr }}

      - name: Write out the SSH private key so Ansible can use it
        if: inputs.action == 'apply'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/devops-pipeline-key
          chmod 600 ~/.ssh/devops-pipeline-key

      # Reads the server IP from SSM itself now (see deploy-k3s.sh),
      # rather than being handed it directly - nothing about how this
      # step is called had to change.
      - name: Run the Ansible playbook to install k3s
        if: inputs.action == 'apply'
        working-directory: ansible
        run: ./deploy-k3s.sh

      - name: Create the three environment namespaces
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      # New in v8. Installed before ArgoCD on purpose: this chart brings
      # in the ServiceMonitor CRD, and the app's own Helm chart (which
      # ArgoCD is about to sync) includes a ServiceMonitor resource -
      # if ArgoCD tried to sync that before the CRD exists, the sync
      # would just fail.
      - name: Add the prometheus-community Helm repo
        if: inputs.action == 'apply'
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      # New in v8.1: renders the real Slack webhook URLs into a throwaway copy
      # of monitoring/alertmanager-config.yaml, right here on the runner's own
      # disk, replacing the __SLACK_WEBHOOK_INFRA__/__SLACK_WEBHOOK_APP__
      # placeholders that are all that's ever committed to Git. This rendered
      # file only ever exists for the lifetime of this job and is never logged,
      # committed, or uploaded as an artifact.
      - name: Render the Alertmanager Slack webhook config
        if: inputs.action == 'apply'
        run: |
          sed \
            -e "s|__SLACK_WEBHOOK_INFRA__|${{ secrets.SLACK_WEBHOOK_INFRA }}|" \
            -e "s|__SLACK_WEBHOOK_APP__|${{ secrets.SLACK_WEBHOOK_APP }}|" \
            monitoring/alertmanager-config.yaml > monitoring/alertmanager-config.rendered.yaml

      - name: Install kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 88.1.5 \
            --namespace monitoring --create-namespace \
            -f monitoring/values.yaml \
            -f monitoring/alertmanager-config.rendered.yaml \
            --wait --timeout 10m

      # New in v8.1. Applied right after kube-prometheus-stack, since that's
      # what installs the PrometheusRule CRD this file depends on - same
      # ordering reason the ServiceMonitor CRD had to come before ArgoCD back
      # in v8.
      - name: Apply the infra-level alerting rules
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -f monitoring/prometheusrule-infra.yaml

      # New in v8.1: Loki (log storage) and Alloy (the collector that actually
      # reads Pod logs and ships them to Loki). Installed from the grafana Helm
      # repo, into the same monitoring namespace as Prometheus and Grafana.
      - name: Add the grafana Helm repo
        if: inputs.action == 'apply'
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Install Loki
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install loki grafana/loki \
            --version 6.27.0 \
            --namespace monitoring --create-namespace \
            -f monitoring/loki-values.yaml \
            --wait --timeout 10m

      - name: Install Grafana Alloy
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install alloy grafana/alloy \
            --version 0.12.5 \
            --namespace monitoring --create-namespace \
            -f monitoring/alloy-values.yaml \
            --wait --timeout 10m

      # Restored from v6, unchanged in spirit from before Jenkins
      # replaced it in v7: create the argocd namespace, install ArgoCD
      # itself pinned to a fixed version so every build behaves
      # identically, wait for its two core Deployments to actually be
      # ready, then register the three per-environment Applications.
      - name: Create the argocd namespace
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: Install ArgoCD
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.2/manifests/install.yaml

      # ArgoCD's own components take a little while to come up after being
      # applied, so this waits until they're actually ready instead of just
      # assuming they are and moving on to whatever step comes next.
      - name: Wait for ArgoCD to come up
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl wait --for=condition=available --timeout=180s deployment/argocd-server -n argocd
          kubectl wait --for=condition=available --timeout=180s deployment/argocd-repo-server -n argocd

      # These three manifests are what actually tell ArgoCD about our app -
      # without this step, ArgoCD would be up and running but managing
      # nothing at all. Same reasoning as the namespaces above: a fresh
      # server has none of this registered yet, so it has to happen here
      # every time, not just once by hand.
      - name: Register the three environment Applications with ArgoCD
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -f argocd/dev-application.yaml
          kubectl apply -f argocd/staging-application.yaml
          kubectl apply -f argocd/production-application.yaml

      # Worth noting: earlier versions of this workflow also saved
      # SECURITY_GROUP_ID (as a repo variable) and KUBECONFIG_B64 (as a
      # repo secret) here, using an admin PAT. Neither is restored -
      # v9 goes a step further than v8 already did and moves the one
      # value that's still genuinely needed (the security group ID)
      # into a plain step output instead, and the operational values
      # anything else might need (server IP, ALB DNS) now live in SSM
      # Parameter Store, written above. No admin PAT is needed anywhere
      # in this workflow anymore.
      - name: Take the temporary SSH and API access back out
        if: always() && inputs.action == 'apply'
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.cidr }} || true
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 6443 \
            --cidr ${{ steps.runner_ip.outputs.cidr }} || true

      # ---------- destroy path ----------

      # Stacks come down in the exact reverse order they went up in.
      # CloudFormation won't allow a stack to be deleted while another
      # stack still has an active Fn::ImportValue reference to one of
      # its Exports, so this order isn't just tidy - deleting out of
      # order would fail outright.
      - name: Delete the load balancer stack
        if: inputs.action == 'destroy'
        run: aws cloudformation delete-stack --stack-name devops-pipeline-loadbalancer

      - name: Wait for the load balancer stack to finish deleting
        if: inputs.action == 'destroy'
        run: aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-loadbalancer

      - name: Delete the compute stack
        if: inputs.action == 'destroy'
        run: aws cloudformation delete-stack --stack-name devops-pipeline-compute

      - name: Wait for the compute stack to finish deleting
        if: inputs.action == 'destroy'
        run: aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-compute

      - name: Delete the network stack
        if: inputs.action == 'destroy'
        run: aws cloudformation delete-stack --stack-name devops-pipeline-network

      - name: Wait for the network stack to finish deleting
        if: inputs.action == 'destroy'
        run: aws cloudformation wait stack-delete-complete --stack-name devops-pipeline-network
