name: Infrastructure (Terraform + Ansible)

# This one's manual on purpose - it touches real AWS money, so it
# should never fire on its own just because someone pushed to main.
# I run it by hand, pick apply or destroy, and approve it myself
# through the aws-infra environment before anything actually happens.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do with the AWS infrastructure?"
        required: true
        type: choice
        options:
          - apply
          - destroy

# Needed so this workflow can request a short-lived OIDC token from
# GitHub and hand it to AWS instead of using a stored access key.
permissions:
  id-token: write
  contents: read

# Just a safety net so two runs of this can't step on each other's
# feet if I accidentally kick it off twice.
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: aws-infra
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::578254188866:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Install Ansible
        if: inputs.action == 'apply'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # New in v8 - needed to install kube-prometheus-stack below. Same
      # install method used back in v3 for local Helm usage.
      - name: Install Helm
        if: inputs.action == 'apply'
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh
          rm get_helm.sh

      - name: Write out the SSH public key so Terraform can import it
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.SSH_PUBLIC_KEY }}" > ~/.ssh/devops-pipeline-key.pub

      - name: Terraform init
        run: terraform init

      # ---------- apply path ----------

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var="my_ip=${{ vars.MY_IP }}"

      - name: Look up the security group this run needs to touch
        if: inputs.action == 'apply'
        id: app_sg
        run: echo "id=$(terraform output -raw security_group_id)" >> "$GITHUB_OUTPUT"

      - name: Figure out this runner's own public IP
        if: inputs.action == 'apply'
        id: runner_ip
        run: echo "cidr=$(curl -s ifconfig.me)/32" >> "$GITHUB_OUTPUT"

      - name: Temporarily let this runner SSH into the app server, just long enough for Ansible
        if: inputs.action == 'apply'
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.cidr }}

      - name: Temporarily let this runner reach the k3s API too
        if: inputs.action == 'apply'
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 6443 \
            --cidr ${{ steps.runner_ip.outputs.cidr }}

      - name: Write out the SSH private key so Ansible can use it
        if: inputs.action == 'apply'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/devops-pipeline-key
          chmod 600 ~/.ssh/devops-pipeline-key

      - name: Run the Ansible playbook to install k3s
        if: inputs.action == 'apply'
        working-directory: ansible
        run: ./deploy-k3s.sh

      - name: Create the three environment namespaces
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      # New in v8. Installed before ArgoCD on purpose: this chart brings
      # in the ServiceMonitor CRD, and the app's own Helm chart (which
      # ArgoCD is about to sync) includes a ServiceMonitor resource -
      # if ArgoCD tried to sync that before the CRD exists, the sync
      # would just fail.
      - name: Add the prometheus-community Helm repo
        if: inputs.action == 'apply'
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      # New in v8.1: renders the real Slack webhook URLs into a throwaway copy
      # of monitoring/alertmanager-config.yaml, right here on the runner's own
      # disk, replacing the __SLACK_WEBHOOK_INFRA__/__SLACK_WEBHOOK_APP__
      # placeholders that are all that's ever committed to Git. This rendered
      # file only ever exists for the lifetime of this job and is never logged,
      # committed, or uploaded as an artifact.
      - name: Render the Alertmanager Slack webhook config
        if: inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        run: |
          sed \
            -e "s|__SLACK_WEBHOOK_INFRA__|${{ secrets.SLACK_WEBHOOK_INFRA }}|" \
            -e "s|__SLACK_WEBHOOK_APP__|${{ secrets.SLACK_WEBHOOK_APP }}|" \
            monitoring/alertmanager-config.yaml > monitoring/alertmanager-config.rendered.yaml

      - name: Install kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
        if: inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 88.1.5 \
            --namespace monitoring --create-namespace \
            -f monitoring/values.yaml \
            -f monitoring/alertmanager-config.rendered.yaml \
            --wait --timeout 10m

      # New in v8.1. Applied right after kube-prometheus-stack, since that's
      # what installs the PrometheusRule CRD this file depends on - same
      # ordering reason the ServiceMonitor CRD had to come before ArgoCD back
      # in v8.
      - name: Apply the infra-level alerting rules
        if: inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -f monitoring/prometheusrule-infra.yaml

      # New in v8.1: Loki (log storage) and Alloy (the collector that actually
      # reads Pod logs and ships them to Loki). Installed from the grafana Helm
      # repo, into the same monitoring namespace as Prometheus and Grafana.
      - name: Add the grafana Helm repo
        if: inputs.action == 'apply'
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Install Loki
        if: inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install loki grafana/loki \
            --version 6.27.0 \
            --namespace monitoring --create-namespace \
            -f monitoring/loki-values.yaml \
            --wait --timeout 10m

      - name: Install Grafana Alloy
        if: inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          helm upgrade --install alloy grafana/alloy \
            --version 0.12.5 \
            --namespace monitoring --create-namespace \
            -f monitoring/alloy-values.yaml \
            --wait --timeout 10m

      # Restored from v6, unchanged in spirit from before Jenkins
      # replaced it in v7: create the argocd namespace, install ArgoCD
      # itself pinned to a fixed version so every build behaves
      # identically, wait for its two core Deployments to actually be
      # ready, then register the three per-environment Applications.
      - name: Create the argocd namespace
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: Install ArgoCD
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.2/manifests/install.yaml

      # ArgoCD's own components take a little while to come up after being
      # applied, so this waits until they're actually ready instead of just
      # assuming they are and moving on to whatever step comes next.
      - name: Wait for ArgoCD to come up
        if: inputs.action == 'apply'
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl wait --for=condition=available --timeout=180s deployment/argocd-server -n argocd
          kubectl wait --for=condition=available --timeout=180s deployment/argocd-repo-server -n argocd

      # These three manifests are what actually tell ArgoCD about our app -
      # without this step, ArgoCD would be up and running but managing
      # nothing at all. Same reasoning as the namespaces above: a fresh
      # server has none of this registered yet, so it has to happen here
      # every time, not just once by hand.
      - name: Register the three environment Applications with ArgoCD
        if: inputs.action == 'apply'
        # This job defaults to running inside terraform/, but the argocd/
        # folder lives at the repo root - without this override, kubectl
        # would look for terraform/argocd/dev-application.yaml instead.
        working-directory: ${{ github.workspace }}
        run: |
          export KUBECONFIG=~/.kube/devops-pipeline-config
          kubectl apply -f argocd/dev-application.yaml
          kubectl apply -f argocd/staging-application.yaml
          kubectl apply -f argocd/production-application.yaml

      # Worth noting: the original v6 version of this workflow also saved
      # SECURITY_GROUP_ID (as a repo variable) and KUBECONFIG_B64 (as a
      # repo secret) here, using ADMIN_PAT. Neither is restored in v8 -
      # v7's own docs already flagged both as dead weight by that point,
      # since nothing has read either of them since ArgoCD took over
      # deploying. No sense bringing back code that was already known to
      # be unused.
      - name: Take the temporary SSH and API access back out
        if: always() && inputs.action == 'apply'
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner_ip.outputs.cidr }} || true
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.app_sg.outputs.id }} \
            --protocol tcp --port 6443 \
            --cidr ${{ steps.runner_ip.outputs.cidr }} || true

      # ---------- destroy path ----------

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var="my_ip=${{ vars.MY_IP }}"
