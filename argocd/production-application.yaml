# Same pattern again, this time for production. The approval story here
# is identical to staging: the pull request that bumps the image tag in
# values-production.yaml is where a human actually reviews and approves
# the change. ArgoCD's job at that point is just to make it real.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-pipeline-production
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/henrysolomon-devops/devops-cicd-pipeline.git
    targetRevision: main
    path: helm/devops-pipeline
    helm:
      valueFiles:
        - values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
