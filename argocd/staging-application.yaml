# Same idea as dev, just pointed at the staging namespace and its own
# values file. This is still marked automated, because the approval for
# staging doesn't happen inside ArgoCD anymore - it happens earlier, when
# the pull request that updates values-staging.yaml gets reviewed and
# merged. By the time ArgoCD sees the change, it's already been approved.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-pipeline-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/henrysolomon-devops/devops-cicd-pipeline.git
    targetRevision: main
    path: helm/devops-pipeline
    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
